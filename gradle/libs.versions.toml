[versions]
kotlin = "2.4.21"
compose = "1.12.2"
spotless = "8.10.4"
camouflage = "0.1.0"
navigation3 = "1.2.0"
lifecycle-navigation3 = "2.11.0"
sinew = "1.1.0"
ktlint = "1.8.0"
junit = "5.14.4"
coroutines = "1.11.0"
# Sinew 1.1 already brings kotlinx-serialization 1.11.0; one version on the classpath.
serialization = "1.11.0"
directory-watcher = "0.19.1"
turbine = "1.2.1"
roborazzi = "1.79.0"
java-diff-utils = "4.18"
highlights = "1.2.0"
koin = "4.2.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-navigation3" }
camouflage-bom = { module = "com.srctool.camouflage:camouflage-bom", version.ref = "camouflage" }
camouflage-core = { module = "com.srctool.camouflage:camouflage-core" }
camouflage-skin-carbon = { module = "com.srctool.camouflage:camouflage-skin-carbon" }
sinew-bom = { module = "com.srctool.sinew:sinew-bom", version.ref = "sinew" }
sinew-models = { module = "com.srctool.sinew:sinew-models" }
sinew-exception = { module = "com.srctool.sinew:sinew-exception" }
sinew-viewmodel = { module = "com.srctool.sinew:sinew-viewmodel" }
sinew-presentation = { module = "com.srctool.sinew:sinew-presentation" }
sinew-l10n = { module = "com.srctool.sinew:sinew-l10n" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
directory-watcher = { module = "io.methvin:directory-watcher", version.ref = "directory-watcher" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
roborazzi-compose-desktop = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop", version.ref = "roborazzi" }
java-diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "java-diff-utils" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Gradle plugins, as libraries for the build-logic convention plugins
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
