# Graft's texts in Indonesian (UX Writing: the same plain, direct voice as English).
git.error.rejected=Remote menolak perubahan ini.
git.error.auth=Git tidak bisa masuk ke remote.
git.error.conflict=Operasi berhenti karena ada konflik.
git.error.unsafeOwner=Git tidak memercayai folder ini karena dimiliki pengguna lain.
git.error.locked=Ada proses Git lain yang sedang berjalan di repositori ini.
git.error.missing=Git belum terpasang, atau Graft tidak bisa menjalankannya.
git.error.notRepository=Folder ini bukan repositori Git.
git.error.network=Git tidak bisa menjangkau remote.
git.error.timeout=Git terlalu lama menjawab.
git.error.version=Git {found} terlalu lama; Graft butuh Git {required} atau lebih baru.
git.error.exit=Git berhenti dengan kode keluar {exitCode}.
data.error.newerFormat=Berkas ini disimpan oleh Graft yang lebih baru (format {found}). Versi ini hanya bisa membacanya.
workspace.error.name=Beri nama workspace ini.
workspace.error.notFound=Workspace itu sudah tidak ada.
identity.error.invalid=Isi nama dan email tanpa baris baru, dan tidak diawali "-".
