# Graft's texts in English. Keys are the message keys the code uses; {name} is an argument.
# The English text is also the code's fallback, and GraftLocalizerTest checks the two match.
git.error.rejected=The remote rejected the change.
git.error.auth=Git couldn't sign in to the remote.
git.error.conflict=The operation stopped on conflicts.
git.error.unsafeOwner=Git doesn't trust this folder because another user owns it.
git.error.locked=Another Git process is running in this repository.
git.error.missing=Git isn't installed, or Graft can't start it.
git.error.notRepository=This folder isn't a Git repository.
git.error.network=Git couldn't reach the remote.
git.error.timeout=Git took too long to answer.
git.error.version=Git {found} is too old; Graft needs Git {required} or newer.
git.error.exit=Git stopped with exit code {exitCode}.
data.error.newerFormat=This file was saved by a newer Graft (format {found}). This version only reads it.
workspace.error.name=Give the workspace a name.
workspace.error.notFound=That workspace no longer exists.
identity.error.invalid=Enter a name and an email without line breaks, not starting with "-".

