name: Documentation
description: Something in the README, the contributor docs or the design docs is wrong, missing or unclear.
labels: ["docs"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file or page, and the section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
